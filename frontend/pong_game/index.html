<html>
	<head>
		<script src="https://cdn.tailwindcss.com"></script>
		<style>
			html, body {
				height: 100%;
				margin: 0;
				padding: 0;
			}
			canvas {
				width: 100%;
				height: 100%;
				max-width: 100%;
				max-height: 100%;
				object-fit: contain;
			}
		</style>
	</head>
	<body class="bg-[#6C0E42]/70">

		<!-- Paddles. The size will be set to what the user selects in game settings -->
		<div id="paddle1" class="bg-[#58d1b7] absolute"></div>
		<div id="paddle2" class="bg-[#8968CD] absolute"></div>

		<!-- Ball -->
		<div id="ball" class="bg-[fffcc2] rounded-full absolute"></div>

		<!-- Powerup elements -->
		<div id="powerup-container" class="relative w-full h-full"></div>

		<!-- Scoreboard -->
		<div id="scoreboard" class="font-mono -translate-x-1/2 fixed top-0 left-1/2 flex space-x-8 text-5xl">
			<div id="p1Score" class="text-[#58d1b7]">0</div>
			<div id="p2Score" class="text-[#8968CD]">0</div>
		</div>

		<!-- Countdown -->
		<div id="countdown" class="text-[#fffcc2] font-mono fixed inset-0 flex items-center justify-center text-9xl"></div>

		<!-- Game End Prompt -->
		<div id="endPrompt" class="hidden fixed inset-0 flex flex-col items-center justify-center min-h-screen">
			<div class="p-6 text-center">
			<div id="endPromptText" class="font-mono text-2xl"></div>
			<div id="endPromptButton" class="bg-[#fffcc2] border-2 border-black text-black px-6 py-2 rounded-lg cursor-pointer hover:bg-[#b06052] hover:text-white transition-colors" 
				onclick="endFunction()">OK</div>
			</div>
		</div>

		<script type="module" src="script.js"></script>

	</body>
</html>
