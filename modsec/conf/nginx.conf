worker_processes 2;

error_log /var/log/nginx/error_log info;

load_module /usr/lib/nginx/modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile off;

    server {
        listen 80;
        return 301 https://$host:4004$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/ssl/local/fullchain.pem;
        ssl_certificate_key /etc/ssl/local/privkey.pem;

        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsec/main.conf;

        root /usr/share/nginx/html;
        index index.html;

        # SPA
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Pong game
        location /pong_game/ {
            alias /usr/share/nginx/html/pong_game/;
            try_files $uri $uri/ /pong_game/index.html;
            # If you really need a default type for loose files:
            default_type application/javascript;
        }

        # Backend API
        location /api {
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://backend:3000;
        }

        # WebSockets
        location /wss {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
            proxy_pass http://backend:3000/wss;
        }

        # Static assets with long cache
        location /assets/ {
            root /usr/share/nginx/html;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # Health
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }
    }
}





